<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MSP Orbit — Site under construction</title>
<meta name="robots" content="noindex" />
<style>
  :root {
    --paper: #fcfcfa;
    --ink: #172036;
    --ink-soft: #4a5268;
    --gold: #f0a824;
    --gold-deep: #a9670c;
    --gold-tint: #fdf1dc;
    --blue-deep: #33487c;
    --line: #e4e1d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", ui-sans-serif, system-ui, -apple-system, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 480px;
    text-align: center;
  }
  .logo {
    height: 56px;
    width: auto;
    margin-bottom: 32px;
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font: 700 12px/1 "Segoe UI", sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-deep);
    background: var(--gold-tint);
    border-radius: 999px;
    padding: 8px 16px;
    margin-bottom: 24px;
  }
  .tag::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    color: var(--blue-deep);
    margin: 0 0 12px;
  }
  p {
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 28px;
  }
  a.contact {
    display: inline-block;
    border-radius: 999px;
    background: var(--blue-deep);
    color: #fff;
    font: 700 14px/1 "Segoe UI", sans-serif;
    text-decoration: none;
    padding: 14px 26px;
  }
  .note {
    margin-top: 20px;
    font-size: 13px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="MSP Orbit" />
    <span class="tag">Under construction</span>
    <h1>Our new site is on its way.</h1>
    <p>
      We're building something new at MSP Orbit. In the meantime, reach out and we'll
      get back to you directly.
    </p>
    <a class="contact" href="mailto:support@msporbit.com">support@msporbit.com</a>
    <p class="note">(914) 406-1119</p>
  </div>
</body>
</html>
